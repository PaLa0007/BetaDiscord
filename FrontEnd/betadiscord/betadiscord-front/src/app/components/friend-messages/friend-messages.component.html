<div class="chat-container">
  <!-- ✅ Chat Header (Displays Friend’s Name) -->
  <div class="chat-header">
    <h2 *ngIf="friendName">{{ friendName }}</h2>
    <h2 *ngIf="!friendName">Loading...</h2>
  </div>

  <!-- ✅ Messages Section (Now Displays Correct Names) -->
  <div class="chat-messages">
    <div *ngFor="let message of messages" [ngClass]="{'my-message': message.sender.id === loggedInUserId, 'other-message': message.sender.id !== loggedInUserId}">
      <strong>
        {{ message.sender.id === loggedInUserId ? 'You' : friendName }}
      </strong>: {{ message.content }}
    </div>
  </div>

  <!-- ✅ Input Field & Send Button -->
  <div class="chat-input">
    <input [(ngModel)]="newMessage" placeholder="Type a message..." />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
